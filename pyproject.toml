[project]
name = "cairn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "caius", email = "luoxiongcai5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.101.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
cairn = "cairn:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
