# Host configuration only. Keep this file outside workspace and worktrees.
# Provider API keys belong in a protected EnvironmentFile or environment.
[server]
host = "127.0.0.1"
port = 8777
workspace = "/workspace/cairn"
# First-use startup preserves an existing service user ~/.local/state/cairn.
# Otherwise these explicit paths apply; existing files are never rewritten.
data_root = "/var/lib/cairn"
worktrees_root = "/var/lib/cairn/worktrees"
provider_approval = "/etc/cairn/provider-approval.json"
offline = false
allow_shell = false
allow_network = false
# Optional: web_root = "/workspace/cairn/web/dist"

[database]
# url = "postgresql://cairn:choose-a-password@localhost:5432/cairn"
# namespace = "cairn"

[budget]
max_steps = 500
max_seconds = 900.0
max_stagnant_steps = 12
# max_tokens = 1000000
# max_cost = 1.0
# input_cost_per_million = 1.0
# output_cost_per_million = 2.0

[services]
wechat = true
schedule = true
memory = true

[knowledge]
# Lexical document search works without vectors; set a model for semantic search.
enabled = true
embedding_model = "qwen3.7-text-embedding-flash"
embedding_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# Empty reuses the approved provider key when the base URLs match.
embedding_key_env = ""
embedding_dims = 0
# Set to a batch size supported by the selected embedding model.
embedding_batch_size = 10
graph_enabled = true
max_upload_bytes = 26214400

[logging]
level = "info"
access_log = true
