<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cairn — Knowledge</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("cairn-theme");
          const preference = stored === "paper" ? "light" : stored === "slate" ? "dark" : stored;
          const hour = new Date().getHours();
          const theme = preference === "light" || preference === "dark"
            ? preference
            : preference === "system"
              ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : (hour >= 6 && hour < 18 ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      html:root, body { margin: 0; background: #f4f5f7; color: #232327; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #141417; color: #ededf0; }
      .boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
      .boot-stage { position: relative; display: grid; place-items: center; width: 104px; height: 104px; }
      .boot-mark { position: relative; z-index: 1; width: 64px; height: 64px; }
      .boot-shadow { position: absolute; bottom: 8px; width: 48px; height: 10px; border-radius: 50%; background: #7a49f2; opacity: .3; filter: blur(5px); }
      .boot-label { color: #5f5a78; line-height: 1.7; letter-spacing: .02em; }
      html[data-theme="dark"] .boot-label { color: #a19cae; }
      @media (prefers-reduced-motion: reduce) { .boot-shadow { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status" aria-live="polite"><div class="boot-stage"><img class="boot-mark" src="/src/assets/cairn-mark.svg" alt="" aria-hidden="true"/><div class="boot-shadow" aria-hidden="true"></div></div><span class="boot-label">正在加载 Cairn…</span></div></div>
    <script type="module" src="/src/main-workbench.tsx"></script>
  </body>
</html>
