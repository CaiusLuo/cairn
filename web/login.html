<!doctype html>
<html lang="en" data-theme="slate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cairn — Sign in</title>
    <style>
      html, body { margin: 0; background: #0b1114; color: #ededf0; }
      .boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
      .boot-stage { position: relative; display: grid; place-items: center; width: 104px; height: 104px; }
      .boot-mark { position: relative; z-index: 1; width: 64px; height: 64px; }
      .boot-shadow { position: absolute; bottom: 8px; width: 48px; height: 10px; border-radius: 50%; background: #7a49f2; opacity: .3; filter: blur(5px); }
      .boot-label { color: #a19cae; line-height: 1.7; letter-spacing: .02em; }
      @media (prefers-reduced-motion: reduce) { .boot-shadow { display: none; } }
    </style>
  </head>
  <body data-theme="slate">
    <div id="root"><div class="boot-screen" role="status" aria-live="polite"><div class="boot-stage"><img class="boot-mark" src="/src/assets/cairn-mark.svg" alt="" aria-hidden="true"/><div class="boot-shadow" aria-hidden="true"></div></div><span class="boot-label">Loading Cairn…</span></div></div>
    <script type="module" src="/src/main-workbench.tsx"></script>
  </body>
</html>
